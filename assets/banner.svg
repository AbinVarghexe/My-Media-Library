<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e11" />
      <stop offset="50%" stop-color="#141418" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2997ff" />
      <stop offset="100%" stop-color="#0a84ff" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0a84ff" />
      <stop offset="100%" stop-color="#30d158" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.75" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bg)" />
  <rect width="1200" height="480" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2" />

  <!-- Ambient Glow Orbs -->
  <circle cx="280" cy="180" r="180" fill="#0a84ff" opacity="0.16" filter="url(#softGlow)" />
  <circle cx="950" cy="240" r="220" fill="#bf5af2" opacity="0.14" filter="url(#softGlow)" />
  <circle cx="620" cy="380" r="160" fill="#30d158" opacity="0.12" filter="url(#softGlow)" />

  <!-- Left Column: Branding & Headlines -->
  <g transform="translate(80, 80)">
    <!-- Badge -->
    <g transform="translate(0, 0)">
      <rect width="210" height="30" rx="15" fill="rgba(10, 132, 255, 0.12)" stroke="rgba(10, 132, 255, 0.35)" stroke-width="1.2" />
      <circle cx="15" cy="15" r="4" fill="#30d158" />
      <text x="30" y="20" fill="#64d2ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.5">APPLE &amp; NOTION MINIMAL UI</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="78" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">
      My Media Library
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="118" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      The ultra-fast personal media browser panel for
    </text>
    <text x="0" y="142" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">
      Adobe Premiere Pro &amp; Adobe After Effects.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 180)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="136" height="32" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="68" y="20" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Dual Host (PR/AE)</text>

      <!-- Pill 2 -->
      <rect x="146" y="0" width="144" height="32" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="218" y="20" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">💾 Disk Persistence</text>

      <!-- Pill 3 -->
      <rect x="300" y="0" width="140" height="32" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="370" y="20" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🎵 Live Waveforms</text>
    </g>

    <!-- Host Badges -->
    <g transform="translate(0, 245)">
      <rect x="0" y="0" width="130" height="38" rx="8" fill="#00005b" stroke="#9999ff" stroke-width="1.5" />
      <text x="14" y="24" fill="#9999ff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="800">Pr</text>
      <text x="42" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Premiere Pro</text>

      <rect x="144" y="0" width="130" height="38" rx="8" fill="#2d004d" stroke="#d985ff" stroke-width="1.5" />
      <text x="158" y="24" fill="#d985ff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="800">Ae</text>
      <text x="186" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">After Effects</text>
    </g>
  </g>

  <!-- Right Column: Mockup Card Illustration -->
  <g transform="translate(620, 48)" filter="url(#cardShadow)">
    <!-- Mockup Container -->
    <rect width="500" height="384" rx="20" fill="#18181b" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
    
    <!-- Mockup Topbar -->
    <rect width="500" height="42" rx="20" fill="#202024" />
    <rect y="22" width="500" height="20" fill="#202024" />
    <circle cx="20" cy="21" r="5" fill="#ff5f56" />
    <circle cx="36" cy="21" r="5" fill="#ffbd2e" />
    <circle cx="52" cy="21" r="5" fill="#27c93f" />

    <!-- Mockup Spotlight Search -->
    <rect x="180" y="10" width="220" height="22" rx="11" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <circle cx="196" cy="21" r="3.5" fill="none" stroke="#86868b" stroke-width="1.2" />
    <line x1="198.5" y1="23.5" x2="202" y2="27" stroke="#86868b" stroke-width="1.2" />
    <text x="210" y="25" fill="#86868b" font-family="-apple-system, sans-serif" font-size="9.5">Search sounds, footage, presets...</text>

    <!-- Mockup Segmented Control Tabs -->
    <g transform="translate(18, 54)">
      <rect width="464" height="26" rx="13" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <rect x="3" y="3" width="88" height="20" rx="10" fill="#0a84ff" />
      <text x="47" y="16.5" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">All Media</text>
      <text x="140" y="16.5" fill="#a1a1a6" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="500" text-anchor="middle">Audio</text>
      <text x="232" y="16.5" fill="#a1a1a6" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="500" text-anchor="middle">Video</text>
      <text x="328" y="16.5" fill="#a1a1a6" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="500" text-anchor="middle">FX &amp; Presets</text>
      <text x="420" y="16.5" fill="#a1a1a6" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="500" text-anchor="middle">Favorites</text>
    </g>

    <!-- Grid of Squircle Cards -->
    <g transform="translate(18, 92)">
      <!-- Card 1: Audio -->
      <g transform="translate(0, 0)">
        <rect width="146" height="154" rx="12" fill="#222226" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
        <rect x="8" y="8" width="130" height="96" rx="8" fill="rgba(48, 209, 88, 0.08)" />
        <path d="M65 42 L80 34 L80 62 L65 70 Z M65 52 L55 52 L55 60 L65 60 Z" fill="#30d158" />
        <text x="12" y="122" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600">Cinematic_Whoosh.wav</text>
        <rect x="12" y="132" width="32" height="13" rx="3" fill="rgba(48, 209, 88, 0.2)" />
        <text x="28" y="141" fill="#30d158" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" text-anchor="middle">WAV</text>
        <text x="50" y="141" fill="#86868b" font-family="-apple-system, sans-serif" font-size="8.5">1.4 MB</text>
      </g>

      <!-- Card 2: Video -->
      <g transform="translate(158, 0)">
        <rect width="146" height="154" rx="12" fill="#222226" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
        <rect x="8" y="8" width="130" height="96" rx="8" fill="rgba(10, 132, 255, 0.08)" />
        <polygon points="68,48 88,60 68,72" fill="#0a84ff" />
        <text x="12" y="122" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600">Film_Grain_4K.mp4</text>
        <rect x="12" y="132" width="32" height="13" rx="3" fill="rgba(10, 132, 255, 0.2)" />
        <text x="28" y="141" fill="#0a84ff" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" text-anchor="middle">MP4</text>
        <text x="50" y="141" fill="#86868b" font-family="-apple-system, sans-serif" font-size="8.5">48 MB</text>
      </g>

      <!-- Card 3: MOGRT FX -->
      <g transform="translate(316, 0)">
        <rect width="146" height="154" rx="12" fill="#222226" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
        <rect x="8" y="8" width="130" height="96" rx="8" fill="rgba(255, 159, 10, 0.08)" />
        <polygon points="76,44 64,62 74,62 70,76 86,56 76,56" fill="#ff9f0a" />
        <text x="12" y="122" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600">Smooth_Title.mogrt</text>
        <rect x="12" y="132" width="46" height="13" rx="3" fill="rgba(255, 159, 10, 0.2)" />
        <text x="35" y="141" fill="#ff9f0a" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" text-anchor="middle">MOGRT</text>
        <text x="64" y="141" fill="#86868b" font-family="-apple-system, sans-serif" font-size="8.5">8.2 MB</text>
      </g>
    </g>

    <!-- Docked Waveform Player Preview -->
    <g transform="translate(0, 266)">
      <rect width="500" height="118" rx="0" fill="#1b1b1f" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      
      <!-- Track Meta & Play Button -->
      <circle cx="34" cy="34" r="16" fill="#0a84ff" />
      <polygon points="31,27 41,34 31,41" fill="#ffffff" />
      <text x="60" y="28" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Cinematic_Whoosh.wav</text>
      <text x="60" y="42" fill="#86868b" font-family="-apple-system, sans-serif" font-size="9">WAV • 1.4 MB • 48kHz 24-bit</text>
      <text x="440" y="34" fill="#a1a1a6" font-family="monospace" font-size="10">0:01 / 0:04</text>

      <!-- Waveform Canvas Mockup -->
      <g transform="translate(18, 56)">
        <rect width="464" height="42" rx="6" fill="#121214" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
        
        <!-- Live Waveform Bars -->
        <!-- Played bars (Green/Blue gradient) -->
        <rect x="10" y="26" width="3" height="12" rx="1.5" fill="url(#waveGrad)" />
        <rect x="16" y="20" width="3" height="18" rx="1.5" fill="url(#waveGrad)" />
        <rect x="22" y="12" width="3" height="26" rx="1.5" fill="url(#waveGrad)" />
        <rect x="28" y="8" width="3" height="30" rx="1.5" fill="url(#waveGrad)" />
        <rect x="34" y="14" width="3" height="24" rx="1.5" fill="url(#waveGrad)" />
        <rect x="40" y="22" width="3" height="16" rx="1.5" fill="url(#waveGrad)" />
        <rect x="46" y="6" width="3" height="32" rx="1.5" fill="url(#waveGrad)" />
        <rect x="52" y="10" width="3" height="28" rx="1.5" fill="url(#waveGrad)" />
        <rect x="58" y="18" width="3" height="20" rx="1.5" fill="url(#waveGrad)" />
        <rect x="64" y="12" width="3" height="26" rx="1.5" fill="url(#waveGrad)" />
        <rect x="70" y="16" width="3" height="22" rx="1.5" fill="url(#waveGrad)" />
        <rect x="76" y="24" width="3" height="14" rx="1.5" fill="url(#waveGrad)" />
        <rect x="82" y="28" width="3" height="10" rx="1.5" fill="url(#waveGrad)" />
        <rect x="88" y="14" width="3" height="24" rx="1.5" fill="url(#waveGrad)" />
        <rect x="94" y="8" width="3" height="30" rx="1.5" fill="url(#waveGrad)" />
        <rect x="100" y="4" width="3" height="34" rx="1.5" fill="url(#waveGrad)" />

        <!-- Unplayed bars (Translucent white) -->
        <rect x="106" y="18" width="3" height="20" rx="1.5" fill="rgba(255,255,255,0.14)" />
        <rect x="112" y="24" width="3" height="14" rx="1.5" fill="rgba(255,255,255,0.14)" />
        <rect x="118" y="12" width="3" height="26" rx="1.5" fill="rgba(255,255,255,0.14)" />
        <rect x="124" y="8" width="3" height="30" rx="1.5" fill="rgba(255,255,255,0.14)" />
        <rect x="130" y="16" width="3" height="22" rx="1.5" fill="rgba(255,255,255,0.14)" />
        <rect x="136" y="22" width="3" height="16" rx="1.5" fill="rgba(255,255,255,0.14)" />
        <rect x="142" y="14" width="3" height="24" rx="1.5" fill="rgba(255,255,255,0.14)" />
        <rect x="148" y="20" width="3" height="18" rx="1.5" fill="rgba(255,255,255,0.14)" />
        <rect x="154" y="28" width="3" height="10" rx="1.5" fill="rgba(255,255,255,0.14)" />
        <rect x="160" y="32" width="3" height="6" rx="1.5" fill="rgba(255,255,255,0.14)" />
      </g>
    </g>
  </g>
</svg>
