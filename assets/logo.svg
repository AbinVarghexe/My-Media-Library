<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1e" />
      <stop offset="50%" stop-color="#121214" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2997ff" />
      <stop offset="100%" stop-color="#0a84ff" />
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30d158" />
      <stop offset="100%" stop-color="#25a244" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bf5af2" />
      <stop offset="100%" stop-color="#5e5ce6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="4" filter="url(#shadow)" />
  <rect x="34" y="34" width="444" height="220" rx="106" fill="url(#blueGlow)" opacity="0.04" />

  <circle cx="160" cy="180" r="90" fill="#0a84ff" opacity="0.15" filter="url(#glow)" />
  <circle cx="340" cy="320" r="100" fill="#bf5af2" opacity="0.12" filter="url(#glow)" />
  <circle cx="360" cy="160" r="70" fill="#30d158" opacity="0.12" filter="url(#glow)" />

  <g transform="translate(116, 110)">
    <path d="M 24 30 L 100 30 C 112 30 120 38 128 48 L 144 68 C 152 78 162 84 176 84 L 256 84 C 270 84 280 95 280 108 L 280 230 C 280 248 266 262 248 262 L 32 262 C 14 262 0 248 0 230 L 0 54 C 0 40 10 30 24 30 Z" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
    <rect x="52" y="150" width="10" height="40" rx="5" fill="url(#emeraldGlow)" />
    <rect x="72" y="130" width="10" height="80" rx="5" fill="url(#emeraldGlow)" />
    <rect x="92" y="110" width="10" height="120" rx="5" fill="url(#blueGlow)" />
    <rect x="112" y="135" width="10" height="70" rx="5" fill="url(#blueGlow)" />
    <rect x="132" y="120" width="10" height="100" rx="5" fill="url(#purpleGlow)" />
    <polygon points="174,136 226,170 174,204" fill="url(#blueGlow)" filter="url(#glow)" />
    <polygon points="174,136 226,170 174,204" fill="#ffffff" />
  </g>

  <g transform="translate(125, 400)">
    <rect x="0" y="0" width="120" height="34" rx="17" fill="rgba(153, 153, 255, 0.15)" stroke="rgba(153, 153, 255, 0.3)" stroke-width="1.5" />
    <text x="60" y="22" fill="#d4bbff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Premiere Pro</text>

    <rect x="142" y="0" width="120" height="34" rx="17" fill="rgba(217, 133, 255, 0.15)" stroke="rgba(217, 133, 255, 0.3)" stroke-width="1.5" />
    <text x="202" y="22" fill="#f0b6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">After Effects</text>
  </g>
</svg>
